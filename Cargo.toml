[package]
name = "blammo"
version = "0.1.0"
edition = "2024"
description = "A write-ahead log"
license = "MIT OR Apache-2.0"
repository = "https://github.com/invertdb/blammo"

[dependencies]
crc32fast = "1.4"
memmap2 = "0.9.11"
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27.0"
